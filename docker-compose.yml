version: '3.6'

services:
  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./lemur_init.sql:/docker-entrypoint-initdb.d/lemur_init.sql
    environment:
      - POSTGRES_PASSWORD
  redis:
    image: "redis:alpine"
    # TODO Find a better way to pass the password
    # to the command section
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  nginx:
    network_mode: host
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: Dockerfile.nginx

  celery-beat:
    image: spotify-lemur
    command: "celery -A lemur.common.celery beat"
    env_file:
    - ".lemur-env"
  celery-worker:
    image: spotify-lemur
    command: celery -A lemur.common.celery worker --concurrency 10 -E -n lemurworker1@%%h
    env_file:
    - ".lemur-env"

volumes:
  pgdata:
