version: '3.6'

services:
  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./lemur_init.sql:/docker-entrypoint-initdb.d/lemur_init.sql
    environment:
      - POSTGRES_PASSWORD
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

volumes:
  pgdata:
