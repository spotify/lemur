version: 2

template:
  type: dockerImage
  dockerImage:
    name: 'spotify-lemur'
    gcpProject: 'xpn-cert-management'
    tugboat:
      path: .

overrides:
  - pipeline: "Master build|Review build"
    override: insert-before
    stage: ".*"
    stages:
      - stage: "Run tests with tox"
        tasks:
          - task: "Test with tox"
            steps:
              - action: gcr.io/action-containers/tox:3.15.0-1@sha256:1a786d1a3bf98afc626875791245d03acdf95840499f92c6511523b2b941644f
                args: ["-c", "spotify-dest-gcp/tox.ini"]
