version: 2

template:
  type: dockerImage
  dockerImage:
    name: 'spotify-lemur'
    gcpProject: 'xpn-cert-management'
    versionWithEpoch: true
    tugboat:
      path: .
    declarativeInfra:
      enabled: true

overrides:
  - pipeline: "Master build|Review build"
    override: insert-before
    stage: ".*"
    stages:
      - stage: "Run tests with tox"
        tasks:
          - task: "Test with tox"
            steps:
              - action: gcr.io/action-containers/tox:4.6.3_20230302T100800@sha256:237512d90010837b6d5f320f5a1e705b2b5da1fa9b9c1b3a0db1712d836d25e7
                args: ["-c", "lemur-plugin-gcp/tox.ini"]
