version: 2

template:
  type: dockerImage
  dockerImage:
    name: 'spotify-lemur'
    gcpProject: 'xpn-cert-management'
    versionWithEpoch: true
    tugboat:
      path: .
    declarativeInfra:
      enabled: true

overrides:
  - pipeline: "Master build|Review build"
    override: insert-before
    stage: ".*"
    stages:
      - stage: "Run tests with tox"
        tasks:
          - task: "Test with tox"
            steps:
              - action: gcr.io/action-containers/tox:4.6.4_20230313T125214@sha256:824da918302fa0f4ef6c8426265b75b6c3bde18ad80c07bfa16501c2996b96f3
                args: ["-c", "lemur-plugin-gcp/tox.ini"]
