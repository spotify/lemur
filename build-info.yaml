version: 2

template:
  type: dockerImage
  dockerImage:
    name: 'spotify-lemur'
    gcpProject: 'xpn-cert-management'
    versionWithEpoch: true
    tugboat:
      path: .
    declarativeInfra:
      enabled: true

overrides:
  - pipeline: "Master build|Review build"
    override: insert-before
    stage: ".*"
    stages:
      - stage: "Run tests with tox"
        tasks:
          - task: "Test with tox"
            steps:
              - action: gcr.io/action-containers/tox:4.6.2@sha256:33b9011d8290b726db69874449f1c4dcb98c38475c081aaf1f04c541795eb62a
                args: ["-c", "lemur-plugin-gcp/tox.ini"]
